<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <span class="material-icons">sports_tennis</span>
      </div>
      <h1>{{ 'auth.welcome' | translate }}</h1>
      <p>{{ 'auth.subtitle' | translate }}</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">{{ 'auth.username' | translate }}</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          [placeholder]="'auth.username_placeholder' | translate"
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="password">{{ 'auth.password' | translate }}</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          [placeholder]="'auth.password_placeholder' | translate"
          class="form-control"
        />
      </div>

      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>

      <button
        type="submit"
        class="btn-primary"
        [disabled]="loading || loginForm.invalid"
      >
        <span *ngIf="!loading">{{ 'auth.login' | translate }}</span>
        <span *ngIf="loading">{{ 'auth.logging_in' | translate }}</span>
      </button>
    </form>
  </div>

  <div class="background-gradient"></div>
</div>
